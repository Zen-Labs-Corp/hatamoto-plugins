# Validates plugin and theme manifests in pull requests (manifests/<name>.json and
# manifests/themes/<name>.json) and runs the validator self-tests, including the
# theme tests. No secrets, no signing: publishing is done by the Hatamoto release
# manager, never by CI.
#
# The `judge` job validates plugin manifests and runs only base-branch code: the
# validator script and the policy/ word lists come from the base branch, and no pull
# request code runs in that job. The base branch must already carry policy/; until it
# does the job fails closed when plugin manifests change. A pull request that edits
# the workflow or scripts is covered by maintainer review, not by this job.
#
# The `build` job compiles each changed plugin (themes have no build and no SDK) at its pinned commit. It needs the
# public Hatamoto SDK (hatamoto.dev/sdk); it runs only when the repository variable
# SDK_PUBLIC is 'true', which is set once the SDK repository is published.
name: validate

on:
  pull_request:
    paths:
      - 'manifests/**'
      - 'policy/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install jsonschema for the schema parity tests
        run: python3 -m pip install --user 'jsonschema==4.23.0'
      - name: Self-test the validator
        run: bash tests/run.sh
      - name: Self-test the theme validator
        run: bash tests/run-themes.sh
      - name: Validate changed theme manifests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            case "$f" in
              manifests/themes/README.md) continue ;;
              manifests/themes/*.json) scripts/validate-theme-manifest.sh "$f" --remote || status=1 ;;
            esac
          done < <(git diff -z --name-only --diff-filter=AMR "origin/$BASE_REF...HEAD" -- manifests)
          exit "$status"

  # Judges plugin manifests. This job runs no code from the pull request: no tests, no
  # PR-head scripts. The validator and policy/ come from the base branch.
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Judge changed plugin manifests with the base branch validator and policy
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          status=0
          # 1. The changed plugin manifests. Type changes are listed; only regular files pass.
          files=()
          while IFS= read -r -d '' f; do
            case "$f" in
              manifests/README.md | manifests/schema.json | manifests/themes/README.md | manifests/themes/*.json) continue ;;
              manifests/*.json) ;;
              manifests/*) echo "$f: only manifests/<name>.json files are allowed here" >&2; status=1; continue ;;
              *) continue ;;
            esac
            base=${f#manifests/}; base=${base%.json}
            if ! [[ $base =~ ^[a-z][a-z0-9-]{1,39}$ ]]; then
              echo "$f: file name must be <name>.json with a valid plugin name" >&2
              status=1; continue
            fi
            mode=$(git ls-files -s -- "$f" | cut -d' ' -f1)
            if [ -L "$f" ] || [ "$mode" != 100644 ]; then
              echo "$f: a manifest must be a regular file, not a symlink or other type" >&2
              status=1; continue
            fi
            files+=("$f")
          done < <(git diff -z --name-only --diff-filter=AMRT "origin/$BASE_REF...HEAD" -- manifests)
          if [ "${#files[@]}" -eq 0 ]; then exit "$status"; fi
          # 2. Copy the validator and policy from the base branch, once. Any failure stops the job.
          trusted=$(mktemp -d)
          trap 'rm -rf "$trusted"' EXIT
          mkdir -p "$trusted/scripts" "$trusted/policy"
          if ! git show "origin/$BASE_REF:scripts/validate-manifest.sh" > "$trusted/scripts/validate-manifest.sh"; then
            echo "the base branch has no validator to judge plugin manifests" >&2
            exit 1
          fi
          for p in reserved-names banned-tokens banned-words brands placeholders; do
            if ! git show "origin/$BASE_REF:policy/$p.txt" > "$trusted/policy/$p.txt"; then
              echo "the base branch has no policy/$p.txt to judge plugin manifests" >&2
              exit 1
            fi
          done
          # 3. Judge.
          for f in "${files[@]}"; do
            bash "$trusted/scripts/validate-manifest.sh" "$f" --remote || status=1
          done
          exit "$status"

  build:
    needs: manifests
    if: vars.SDK_PUBLIC == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - name: Build changed plugins at their pinned commits
        env:
          BASE_REF: ${{ github.base_ref }}
          # The registry build uses this exact toolchain (core backend/go.mod) and never downloads another.
          GOTOOLCHAIN: go1.27.3
          GOWORK: 'off'
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          while IFS= read -r -d '' f; do
            case "$f" in
              manifests/README.md | manifests/schema.json | manifests/themes/README.md | manifests/themes/*.json) continue ;;
              manifests/*.json) ;;
              manifests/*) echo "$f: only manifests/<name>.json files are allowed here" >&2; exit 1 ;;
              *) continue ;;
            esac
            base=${f#manifests/}; base=${base%.json}
            if ! [[ $base =~ ^[a-z][a-z0-9-]{1,39}$ ]]; then
              echo "$f: file name must be <name>.json with a valid plugin name" >&2
              exit 1
            fi
            name=$(jq -r .name "$f")
            repo=$(jq -r .repo "$f")
            commit=$(jq -r .commit "$f")
            subdir=$(jq -r '.subdir // ""' "$f")
            src="$work/$name"
            mkdir -p "$src"
            git -C "$src" init -q
            git -C "$src" fetch -q --depth 1 "$repo" "$commit"
            git -C "$src" checkout -q FETCH_HEAD
            "$GITHUB_WORKSPACE/scripts/check-gomod.sh" "$src/$subdir" "$src"
            cd "$src/$subdir"
            mkdir -p build
            CGO_ENABLED=0 GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o build/plugin.wasm .
            cp plugin.json build/plugin.json
            for d in migrations ui assets; do
              if [ -d "$d" ]; then cp -r "$d" "build/$d"; fi
            done
            test -s build/plugin.wasm
            built=$(jq -r .name build/plugin.json)
            if [ "$built" != "$name" ]; then
              echo "$f: plugin.json name $built does not match $name" >&2
              exit 1
            fi
            cd "$GITHUB_WORKSPACE"
            echo "built $name"
          done < <(git diff -z --name-only --diff-filter=AMR "origin/$BASE_REF...HEAD" -- manifests)
