# Mirrors the pinned source of each approved community plugin into a repository
# we own, so deleting the author's repository cannot remove an approved plugin.
# See scripts/mirror-plugin.sh.
#
# Runs only on a push to main (after review and merge) or by hand on main, never
# on a pull request. The token is the ENVIRONMENT secret MIRROR_TOKEN of the
# environment `plugin-mirror` (deployment branches: main only), not a repository
# secret: a fine-grained token owned by the archive organization with
# Administration + Contents read/write. mirror-plugin.sh hands it only to the gh
# create call and the push, never to a fetch of upstream code or go mod vendor. The
# variable MIRROR_ORG names that organization; SDK_PUBLIC=true turns on go mod
# vendor once the SDK is fetchable. The job runs no plugin code and never signs.
name: mirror

on:
  push:
    branches: [main]
    paths:
      - 'manifests/*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: plugin-mirror
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
      - name: Mirror changed manifests
        env:
          GOTOOLCHAIN: go1.27.2
          GOWORK: 'off'
          MIRROR_ORG: ${{ vars.MIRROR_ORG || 'hatamoto-plugins-archive' }}
          SDK_PUBLIC: ${{ vars.SDK_PUBLIC }}
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Every manifest on a manual run, a first push, or an unknown base.
          all=1
          if [ "$EVENT" = push ] && [[ $BEFORE =~ ^[0-9a-f]{40}$ ]] \
            && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            all=0
          fi
          if [ "$all" -eq 1 ]; then
            list() { git ls-files -z -- 'manifests/*.json'; }
          else
            list() { git diff -z --name-only --diff-filter=AM "$BEFORE" "$SHA" -- 'manifests/*.json'; }
          fi
          status=0
          while IFS= read -r -d '' f; do
            case "$f" in
              manifests/schema.json | manifests/themes/*) continue ;;
              manifests/*/*) continue ;;
            esac
            echo "mirroring $f"
            scripts/mirror-plugin.sh "$f" || status=1
          done < <(list)
          exit "$status"
